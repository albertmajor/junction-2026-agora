[project]
name = "agora"
version = "0.1.0"
description = "Agora: one search box for everything you can buy. True cost, live watchers, agent door."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "extruct>=0.17",
  "price-parser>=0.3",
  "pytest>=8",
  "mcp>=2.3",
  "panzi-json-logic>=1.0",
  "imagehash>=4.3",
  "pillow>=10",
  "tldextract>=5",
  "python-whois>=0.9",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs network + Context.dev credits (AGORA_LIVE=1)"]
