<!doctype html>
<html lang="en" data-brand="PriceMonkey">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PriceMonkey</title>
<meta name="description" content="PriceMonkey: one search box for everything you can buy, new, refurbished or used. Ranked by what you pay, all in. No paid placements.">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PriceMonkey">
<meta property="og:title" content="PriceMonkey · every way to buy it, ranked by what you pay">
<meta property="og:description" content="New, refurbished and used offers from shops across Europe on one line, at the price you pay all in. No paid placements.">
<meta property="og:image" content="/web/assets/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The PriceMonkey mascot, a brown monkey holding a banana, next to the PriceMonkey wordmark">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="PriceMonkey">
<meta name="twitter:description" content="Every way to buy it, ranked by what you pay, all in.">
<meta name="twitter:image" content="/web/assets/brand/og-image.png">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/web/css/base.css">
<link rel="stylesheet" href="/web/css/line.css">
<link rel="stylesheet" href="/web/css/sheet.css">
<link rel="stylesheet" href="/web/css/watch.css">
<link rel="stylesheet" href="/web/css/livelog.css">
<link rel="stylesheet" href="/web/css/landing.css">
<link rel="stylesheet" href="/web/css/tree.css">
<link rel="stylesheet" href="/web/css/catpage.css">
<link rel="stylesheet" href="/web/css/listings.css">
<link rel="icon" href="/web/assets/brand/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/web/assets/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/web/assets/brand/apple-touch-icon.png">
</head>
<body>
<div id="app" data-phase="start">
  <a class="skip" href="#q">Skip to search</a>

  <header id="bar">
    <a class="logo" href="/" aria-label="Start over">
      <img class="logo-mark" src="/web/assets/brand/logo.svg" width="40" height="34" alt="">
      <span class="brand">Price<b>Monkey</b></span>
    </a>
    <form id="ask" role="search" autocomplete="off">
      <label class="sr" for="q">What do you want to buy?</label>
      <input id="q" name="q" type="search" enterkeyhint="search" spellcheck="false"
             placeholder="a camera, a used iPhone, someone to clean my flat…" maxlength="160">
      <button type="submit" class="go" aria-label="Search"><span aria-hidden="true">→</span></button>
    </form>
    <nav id="links" aria-label="More">
      <a href="#how" id="how-top" data-open="drawer">how it works</a>
      <a href="#agent" id="agent-top" data-open="agent">for agents</a>
    </nav>
  </header>

  <nav id="crumbs" aria-label="Category" hidden></nav>
  <div id="chips" aria-label="What we understood" hidden></div>
  <div id="ticker" aria-live="polite" hidden>
    <span class="tick-text"><span class="tick-cur"></span></span>
  </div>
  <section id="reading" class="livelog" aria-label="Live log" hidden></section>

  <main id="main">
    <section id="start" aria-labelledby="ask-title">
      <img class="start-monkey" src="/web/assets/brand/mascot.svg" width="72" height="131" alt="" aria-hidden="true">
      <h1 id="ask-title">What do you want to <em>buy</em>?</h1>
      <div id="examples" aria-label="Try one"></div>
    </section>

    <div id="status" aria-live="polite"></div>

    <section id="verdict" aria-live="polite"></section>
    <section id="market" aria-label="How big the market is" hidden></section>

    <section id="line" aria-label="Offers on one price line, cheaper left, dearer right"></section>
    <div id="tag"></div>

    <section id="finale" aria-live="polite"></section>
    <section id="ledger" aria-label="Every offer, ranked" hidden></section>
    <section id="catpage" aria-live="polite"></section>
  </main>

  <section id="landing" aria-label="About">
    <a class="scroll-cue" href="#ld-browse" aria-label="Browse everything you can buy, below"><i aria-hidden="true"></i><span>browse everything ↓</span></a>
  </section>

  <aside id="sheet" aria-hidden="true"></aside>
  <aside id="drawer" aria-hidden="true"></aside>
  <div id="agent" aria-hidden="true"></div>

  <div id="lab" hidden aria-label="Lab panel"></div>

  <footer id="rule">
    <p class="say"><img class="rule-mark" src="/web/assets/brand/logo.svg" width="19" height="16" alt="">Ranked by what you pay, all in. No paid placements. <span class="nb soft">We may earn a fee, never a better spot.</span></p>
    <p class="foot-links"><a class="cd-mark" href="https://context.dev" target="_blank" rel="noopener">Powered by <img src="https://www.google.com/s2/favicons?domain=context.dev&amp;sz=64" alt="" width="14" height="14" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'cd-sq'}))"> <b>Context.dev</b></a><a href="/lab" id="lab-link" hidden>lab</a></p>
  </footer>
</div>
<script type="module" src="/web/js/main.js"></script>
</body>
</html>
